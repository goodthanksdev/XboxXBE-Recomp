# XDK 5120 library data layouts (D3D8LTCG), read from Kung Fu Chaos (default.xbe). Many fields sit where 4831 has them;
# from the frame buffers on they are 4831's minus 0xC00 (miniport at +0x17C0, D3DDevice_PersistDisplay 0x2BA4C9).
# "inferred" = 4831's value with that shift, not yet seen in code.
[layout]
CDevice_Push              = 0x0    # the push pointer: 0x2BC865 compares it with +4
CDevice_PushThreshold     = 0x4
CDevice_BaseVertex        = 0x1C   # D3DDevice_DrawIndexedVertices 0x2BCC4E reads it
CDevice_IndexBuffer       = 0x2024 # unproven and unused: the game passes indices to the draws (+0x38C is the light array)
CDevice_ZScale            = 0x50C  # the viewport scale code 0x2B8935.. multiplies by +0x50C, +0x518, +0x51C
CDevice_SuperSampleX      = 0x518
CDevice_SuperSampleY      = 0x51C
CDevice_Transforms        = 0x810  # 0x2B9A36: +0x810 + type * 64
CDevice_Textures          = 0xB38  # D3DDevice_SetTexture 0x2B9FB0 reads, 0x2B9FE7 stores [stage]
CDevice_Palettes          = 0xB48  # inferred: Textures + 0x10
CDevice_RenderTarget      = 0x15B4 # D3DDevice_GetRenderTarget2 0x2B99A5
CDevice_Depth             = 0x15B8 # inferred
CDevice_BackBuffer        = 0x15C0 # inferred
CDevice_FrontBuffer       = 0x15C4 # the swap code 0x2BE763 reads it
CDevice_SwapCount         = 0x2010 # D3DDevice_Swap 0x2BE800 increments it
CDevice_Size              = 0x2030 # Direct3D_CreateDevice 0x2BD9BA clears 0x80C dwords on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x2BD980 ors BehaviorFlags & 0x10 into it
CDevice_Time              = 0x2C   # D3DDevice_SetTexture 0x2B9FC3
CDevice_PixelShader       = 0x36C  # D3DDevice_SetPixelShaderConstant 0x2BC501 reads the current one
CDevice_VertexShader      = 0x37C  # D3DDevice_SetVertexShader 0x2BBD31 (XbSymbolDatabase D3DDevice__m_VertexShader_OFFSET)
CDevice_Viewport          = 0xA90  # 0x2B837D, 0x2B8935.. read X, Y, Width, Height
CDevice_AutoDepth         = 0x15CC # inferred
CDevice_VBlankCallback    = 0x1950 # inferred: miniport + 0x190
CDevice_VBlankEvent       = 0x1954 # inferred: miniport + 0x194
CDevice_DisplayFlags      = 0x1974 # inferred: miniport + 0x1B4
CDevice_VBlankCount       = 0x1980 # inferred: miniport + 0x1C0
CDevice_Field             = 0x1990 # inferred: miniport + 0x1D0
CDevice_GammaRamps        = 0x199C # inferred: miniport + 0x1DC
CDevice_GammaPending      = 0x1F9C # inferred: miniport + 0x7DC
# D3D8 globals
DirtyFlags_Texture        = 0x4800 # D3DDevice_SetTexture 0x2BA02E
TextureState_Stage        = 32     # D3DDevice_SetTextureStageStateNotInline 0x2B8846: stage << 5
Stream_Size               = 12     # D3DDevice_SetStreamSource 0x2BB39A
Stream_Stride             = 0x0    # 0x2BB3D0
Stream_Buffer             = 0x8    # 0x2BB3A0
PixelShader_Definition    = 0x8    # inferred, as in 4831 and 5558
# DSOUND (inferred, as in 4831 and 5558)
CDirectSoundStream_Vtable  = 0x0
CDirectSoundStream_Vtable2 = 0x4
EffectsImage_Skip0         = 0x804
EffectsImage_Skip1         = 0x80C
EffectsImage_Desc          = 0x818
# XAPI XPP device type record (inferred)
XPP_Current               = 0x0
XPP_Changed               = 0x4
XPP_Previous              = 0x8
